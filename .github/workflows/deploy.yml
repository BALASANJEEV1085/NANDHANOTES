name: Build & Deploy to EC2 Docker

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: nandhanotes
  INSTANCE_ID: i-test

jobs:
  deploy:
    name: Build, Push and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push Docker image to ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          set -e
          FULL_IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY"
          echo "Building $FULL_IMAGE:latest"
          docker build --tag "$FULL_IMAGE:$GITHUB_SHA" --tag "$FULL_IMAGE:latest" .
          docker push "$FULL_IMAGE:$GITHUB_SHA"
          docker push "$FULL_IMAGE:latest"
          echo "full_image=$FULL_IMAGE" >> "$GITHUB_OUTPUT"

      - name: Deploy to EC2 via SSM
        if: ${{ env.INSTANCE_ID != '' }}
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          set -e
          AWS_REGION="ap-south-1"
          INSTANCE_ID="i-test"
          ECR_REGISTRY="${ECR_REGISTRY:-nandhanotes.dkr.ecr.ap-south-1.amazonaws.com}"
          REPO="nandhanotes"
          SECRET_ID="deptic/NANDHANOTES/secrets"
          FULL_IMAGE="$ECR_REGISTRY/$REPO:latest"
          TARGET_PORT="5000"

          echo "==> Waiting for SSM agent on instance $INSTANCE_ID in $AWS_REGION..."
          PING="Offline"
          for i in $(seq 1 30); do
            PING=$(aws ssm describe-instance-information \
              --region "$AWS_REGION" \
              --filters "Key=InstanceIds,Values=$INSTANCE_ID" \
              --query "InstanceInformationList[0].PingStatus" \
              --output text 2>/dev/null || true)
            echo "SSM Ping [$i/30]: $PING"
            if [ "$PING" = "Online" ]; then
              break
            fi
            sleep 10
          done

          if [ "$PING" != "Online" ]; then
            echo "==> SSM agent never came online. Aborting deploy."
            exit 1
          fi

          # Write the SSM command payload to a JSON file — this avoids
          # ALL shell quoting issues from embedding a JSON array of
          # double-quoted strings inside a double-quoted CLI argument.
          cat > /tmp/ssm-params.json << SSMPARAMS
          {
            "commands": [
              "systemctl start docker 2>/dev/null || service docker start 2>/dev/null || true",
              "until docker info > /dev/null 2>&1; do sleep 2; done",
              "aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY",
              "docker pull $FULL_IMAGE",
              "docker stop app 2>/dev/null || true",
              "docker rm app 2>/dev/null || true",
              "aws secretsmanager get-secret-value --region $AWS_REGION --secret-id $SECRET_ID --query SecretString --output text | python3 -c \"import sys,json; [print(k, v, sep=chr(61)) for k, v in json.load(sys.stdin).items()]\" > /home/ubuntu/app.env 2>/dev/null || touch /home/ubuntu/app.env",
              "docker run -d --restart always -p 80:$TARGET_PORT -e PORT=$TARGET_PORT -e HOSTNAME=0.0.0.0 --env-file /home/ubuntu/app.env --name app $FULL_IMAGE"
            ]
          }
          SSMPARAMS

          echo "==> Sending SSM deployment command to instance $INSTANCE_ID..."
          CMD_ID=$(aws ssm send-command \
            --region "$AWS_REGION" \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/ssm-params.json \
            --query "Command.CommandId" \
            --output text)
          echo "SSM CommandId: $CMD_ID"

          echo "==> Polling command status..."
          for i in $(seq 1 36); do
            sleep 5
            STATUS=$(aws ssm get-command-invocation \
              --region "$AWS_REGION" \
              --command-id "$CMD_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" \
              --output text 2>/dev/null || true)
            echo "Status [$i/36]: $STATUS"
            if [ "$STATUS" = "Success" ]; then
              echo "==> Deployment successfully finished!"
              exit 0
            fi
            if [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
              echo "==> SSM Command Failed!"
              aws ssm get-command-invocation \
                --region "$AWS_REGION" \
                --command-id "$CMD_ID" \
                --instance-id "$INSTANCE_ID" \
                --query "StandardErrorContent" \
                --output text 2>/dev/null || true
              exit 1
            fi
          done
          echo "==> Timed out waiting for SSM command execution."
          exit 1
