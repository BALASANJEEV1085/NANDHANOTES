name: Build, Deploy and Verify NANDHANOTES (EC2 Docker)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: 759204735992.dkr.ecr.ap-south-1.amazonaws.com
  ECR_REPOSITORY: nandhanotes
  INSTANCE_ID: i-03fcf096d1c60323a
  SERVER_NAME: nandhanotes-server
  PUBLIC_URL: http://3.7.135.174
  SECRET_ID: deptic/NANDHANOTES/secrets
  CONTAINER_PORT: "80"
  DOCKERFILE_PATH: .

jobs:
  build-and-deploy:
    name: Build, Push, Deploy and Verify
    runs-on: ubuntu-latest

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js for build diagnostics
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build diagnostics - repository topology
        run: |
          set -e
          echo "==> Repository layout"
          ls -la
          echo "==> Backend manifest (server.js entrypoint, express deps)"
          cat backend/package.json
          echo "==> Frontend manifest (vite build script)"
          cat frontend/package.json
          echo "==> Dockerfile (multi-stage: frontend-builder -> backend-builder -> nginx + node)"
          cat Dockerfile
          echo "==> .dockerignore"
          cat .dockerignore || true

      - name: Build diagnostics - frontend dependency install check
        run: |
          set -e
          cd frontend
          node --version
          npm --version
          npm install --include=dev --legacy-peer-deps
          echo "==> vite resolved version:"
          npx vite --version || true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Amazon ECR (direct AWS CLI, static credentials)
        id: login-ecr
        run: |
          set -e
          export AWS_REGION="$AWS_REGION"
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"
          echo "registry=$ECR_REGISTRY" >> "$GITHUB_OUTPUT"

      - name: Build, tag and push Docker image to ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          set -e
          FULL_IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY"
          echo "Building $FULL_IMAGE from context: $DOCKERFILE_PATH"
          docker build \
            --tag "$FULL_IMAGE:$GITHUB_SHA" \
            --tag "$FULL_IMAGE:latest" \
            --file Dockerfile \
            "$DOCKERFILE_PATH"
          docker push "$FULL_IMAGE:$GITHUB_SHA"
          docker push "$FULL_IMAGE:latest"
          echo "full_image=$FULL_IMAGE" >> "$GITHUB_OUTPUT"
          echo "image_uri=$FULL_IMAGE:latest" >> "$GITHUB_OUTPUT"

      - name: Deploy to EC2 via SSM (file-based parameters)
        id: deploy
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          set -e
          export AWS_ACCESS_KEY_ID="$AWS_ACCESS_KEY_ID"
          export AWS_SECRET_ACCESS_KEY="$AWS_SECRET_ACCESS_KEY"
          export AWS_DEFAULT_REGION="$AWS_DEFAULT_REGION"
          export AWS_REGION="$AWS_DEFAULT_REGION"
          REGION="$AWS_REGION"
          INSTANCE_ID="$INSTANCE_ID"
          SERVER_NAME="$SERVER_NAME"
          ECR_REGISTRY="${ECR_REGISTRY:-759204735992.dkr.ecr.ap-south-1.amazonaws.com}"
          REPO="nandhanotes"
          IMAGE_URI="$ECR_REGISTRY/$REPO:latest"
          CONTAINER_PORT="$CONTAINER_PORT"

          # Dynamic resolution: if INSTANCE_ID missing or not running, locate by tag
          if [ -z "$INSTANCE_ID" ] || ! aws ec2 describe-instances --region "$REGION" --instance-ids "$INSTANCE_ID" --query "Reservations[0].Instances[0].State.Name" --output text 2>/dev/null | grep -q "running"; then
            echo "==> Resolving active EC2 instance by tag Name=$SERVER_NAME..."
            RESOLVED_ID=$(aws ec2 describe-instances --region "$REGION" \
              --filters "Name=tag:Name,Values=$SERVER_NAME" "Name=instance-state-name,Values=running" \
              --query "Reservations[0].Instances[0].InstanceId" --output text 2>/dev/null || true)
            if [ -n "$RESOLVED_ID" ] && [ "$RESOLVED_ID" != "None" ]; then
              INSTANCE_ID="$RESOLVED_ID"
              echo "==> Resolved instance: $INSTANCE_ID"
            else
              echo "ERROR: No running EC2 instance found for $SERVER_NAME" >&2
              exit 1
            fi
          fi
          echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"

          cat > /tmp/ssm-params.json << 'SSMPARAMS'
          {
            "commands": [
              "set -e",
              "export AWS_REGION=ap-south-1",
              "ECR_REGISTRY=759204735992.dkr.ecr.ap-south-1.amazonaws.com",
              "IMAGE_URI=759204735992.dkr.ecr.ap-south-1.amazonaws.com/nandhanotes:latest",
              "aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY",
              "docker pull $IMAGE_URI",
              "docker stop app || true",
              "docker rm app || true",
              "docker run -d --restart always -p 80:80 --name app $IMAGE_URI",
              "sleep 5",
              "docker ps --filter name=app --format '{{.ID}} {{.Status}}'"
            ]
          }
          SSMPARAMS

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --region "$REGION" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/ssm-params.json \
            --query "Command.CommandId" --output text)
          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"
          echo "==> SSM command sent: $COMMAND_ID"

          # Wait for SSM command completion
          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --region "$REGION" \
              --query "Status" --output text 2>/dev/null || echo "Pending")
            echo "==> SSM status: $STATUS"
            if [ "$STATUS" = "Success" ]; then
              echo "==> SSM deploy command succeeded"
              break
            fi
            if [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
              echo "ERROR: SSM command failed with status $STATUS" >&2
              aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --region "$REGION" || true
              exit 1
            fi
            sleep 10
          done
          if [ "$STATUS" != "Success" ]; then
            echo "ERROR: SSM command did not complete in time (last status: $STATUS)" >&2
            exit 1
          fi

      - name: Verify deployment - health check (HTTP 200 required)
        run: |
          set -e
          PUBLIC_URL="$PUBLIC_URL"
          echo "==> Waiting for application to become healthy at $PUBLIC_URL ..."
          SUCCESS=0
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /tmp/health-body.json -w "%{http_code}" "$PUBLIC_URL/" || true)
            echo "==> Attempt $i: HTTP $CODE"
            if [ "$CODE" = "200" ]; then
              SUCCESS=1
              break
            fi
            sleep 10
          done
          if [ "$SUCCESS" != "1" ]; then
            echo "ERROR: Health check against $PUBLIC_URL/ never returned HTTP 200" >&2
            exit 1
          fi
          echo "==> Root response body:"
          cat /tmp/health-body.json || true
          echo ""
          echo "==> nginx /api/ proxy check (informational):"
          API_CODE=$(curl -s -o /tmp/health-api.json -w "%{http_code}" "$PUBLIC_URL/api/health" || true)
          echo "==> /api/health returned HTTP $API_CODE"
          cat /tmp/health-api.json || true
          echo ""
          echo "==> Final assertion: root endpoint must be HTTP 200"
          FINAL_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$PUBLIC_URL/")
          if [ "$FINAL_CODE" != "200" ]; then
            echo "ERROR: Final health check failed with HTTP $FINAL_CODE" >&2
            exit 1
          fi
          echo "==> Deployment verified: HTTP 200 from $PUBLIC_URL/"