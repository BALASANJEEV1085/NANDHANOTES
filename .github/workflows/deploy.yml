        name: Build & Deploy to EC2 Docker

        on:
          push:
            branches: [main, master]
          workflow_dispatch:

        env:
          AWS_REGION: ap-south-1
          ECR_REPOSITORY: nandhanotes
          INSTANCE_ID: i-04a1fa3a50db3f6f0

        jobs:
          deploy:
            name: Build, Push and Deploy
            runs-on: ubuntu-latest

            steps:
              - name: Checkout repository
                uses: actions/checkout@v4

              - name: Configure AWS credentials
                uses: aws-actions/configure-aws-credentials@v4
                with:
                  aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                  aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                  aws-region: ap-south-1

              - name: Login to Amazon ECR
                id: login-ecr
                uses: aws-actions/amazon-ecr-login@v2

- name: Generate Dockerfile if missing
  run: |
    if [ -f Dockerfile ]; then
      echo "==> Dockerfile exists."
      exit 0
    fi
    echo "==> No Dockerfile - generating for node app..."
    PKG=""
    while IFS= read -r line; do PKG="$line"; break; done < <(find . -name package.json -not -path "*/node_modules/*" -not -path "*/.git/*" 2>/dev/null | sort)
    GOMOD=""
    while IFS= read -r line; do GOMOD="$line"; break; done < <(find . -name go.mod -not -path "*/.git/*" 2>/dev/null)
    REQTXT=""
    while IFS= read -r line; do REQTXT="$line"; break; done < <(find . -name requirements.txt -not -path "*/.git/*" 2>/dev/null)
    if [ -n "$PKG" ]; then
      PKGDIR=$(dirname "$PKG"); PKGDIR="${PKGDIR#./}"
      PORT=5000
      if grep -q '"express"\|"fastify"\|"koa"\|"hapi"' "$PKG" 2>/dev/null; then PORT=5000; fi
      if grep -q '"next"\|"react-scripts"\|"vite"' "$PKG" 2>/dev/null; then PORT=3000; fi
      if [ "$PKGDIR" = "." ] || [ "$PKGDIR" = "" ]; then
        INSTALL="npm install --legacy-peer-deps"; START="npm start"
      else
        INSTALL="cd $PKGDIR && npm install --legacy-peer-deps"; START="cd $PKGDIR && npm start"
      fi
      printf 'FROM node:20-alpine\nWORKDIR /app\nCOPY . .\nRUN %s\nEXPOSE %s\nCMD ["sh","-c","%s"]\n' "$INSTALL" "$PORT" "$START" > Dockerfile
    elif [ -n "$GOMOD" ]; then
      GODIR=$(dirname "$GOMOD"); GODIR="${GODIR#./}"
      printf 'FROM golang:1.22-alpine AS b\nRUN apk add --no-cache git\nWORKDIR /app\nCOPY . .\nRUN cd %s && go mod download && CGO_ENABLED=0 go build -o server ./...\nFROM alpine:3.19\nWORKDIR /app\nCOPY --from=b /app/%s/server ./server\nEXPOSE 8080\nCMD ["./server"]\n' "$GODIR" "$GODIR" > Dockerfile
    elif [ -n "$REQTXT" ]; then
      REQDIR=$(dirname "$REQTXT"); REQDIR="${REQDIR#./}"
      if [ "$REQDIR" = "." ] || [ "$REQDIR" = "" ]; then RF="requirements.txt"; else RF="$REQDIR/requirements.txt"; fi
      printf 'FROM python:3.11-slim\nWORKDIR /app\nCOPY . .\nRUN pip install --no-cache-dir -r %s 2>/dev/null || true\nEXPOSE 8000\nCMD ["python","main.py"]\n' "$RF" > Dockerfile
    else
      printf 'FROM node:20-alpine\nWORKDIR /app\nCOPY . .\nEXPOSE 5000\nCMD ["sh","-c","echo ready"]\n' > Dockerfile
    fi
    echo "==> Generated Dockerfile:"; cat Dockerfile

              - name: Build, tag, and push Docker image to ECR
                id: build-image
                env:
                  ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
                run: |
                  set -e
                  FULL_IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY"
                  echo "Building $FULL_IMAGE:latest"
                  docker build --tag "$FULL_IMAGE:$GITHUB_SHA" --tag "$FULL_IMAGE:latest" .
                  docker push "$FULL_IMAGE:$GITHUB_SHA"
                  docker push "$FULL_IMAGE:latest"
                  echo "full_image=$FULL_IMAGE" >> $GITHUB_OUTPUT

              - name: Deploy to EC2 via SSM
                if: ${{ env.INSTANCE_ID != '' }}
