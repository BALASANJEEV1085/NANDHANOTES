name: Deploy to EC2

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: nandhanotes
  INSTANCE_ID: i-0ceabd5004d6fa04e

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag and Push Docker Image
        run: |
          docker build -t ${{ env.ECR_REPOSITORY }} .
          docker tag ${{ env.ECR_REPOSITORY }}:latest ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          docker tag ${{ env.ECR_REPOSITORY }}:latest ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          docker push ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          docker push ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

      - name: Deploy to EC2
        if: env.INSTANCE_ID != ''
        run: |
          python3 - << 'PYEOF'
          import subprocess
          import json
          import sys
          import time

          instance_id = sys.argv[1]
          region = sys.argv[2]
          ecr_repo = sys.argv[3]

          def wait_for_ssm_agent(instance_id):
              while True:
                  response = subprocess.check_output(
                      ['aws', 'ssm', 'describe-instance-information', '--filters', f'Key=InstanceIds,Values={instance_id}', '--query', 'InstanceInformationList[0].PingStatus', '--output', 'text', '--region', region]
                  ).decode('utf-8').strip()
                  if response == 'Online':
                      break
                  time.sleep(5)

          def send_command(instance_id, commands):
              response = subprocess.check_output(
                  ['aws', 'ssm', 'send-command', '--document-name', 'AWS-RunShellScript', '--targets', f'Key=instanceids,Values={instance_id}', '--parameters', f'commands={json.dumps(commands)}', '--region', region]
              )
              command_id = json.loads(response)['Command']['CommandId']
              return command_id

          def get_command_invocation(command_id, instance_id):
              response = subprocess.check_output(
                  ['aws', 'ssm', 'get-command-invocation', '--command-id', command_id, '--instance-id', instance_id, '--region', region]
              )
              return json.loads(response)

          wait_for_ssm_agent(instance_id)

          commands = [
              "systemctl start docker 2>/dev/null || service docker start 2>/dev/null || true",
              "until docker info > /dev/null 2>&1; do echo waiting; sleep 3; done",
              f"aws ecr get-login-password --region {region} | docker login --username AWS --password-stdin {ecr_repo}",
              f"docker pull {ecr_repo}:latest",
              "docker stop app 2>/dev/null || true",
              "docker rm app 2>/dev/null || true",
              'aws secretsmanager get-secret-value --region ap-south-1 --secret-id deptic/NANDHANOTES/secrets --query SecretString --output text | python3 -c "import sys,json; d=json.load(sys.stdin); [print(k + \'=\' + v) for k,v in d.items()]" > /home/ubuntu/app.env 2>/dev/null || touch /home/ubuntu/app.env',
              f'docker run -d --restart always -p 80:5000 --env-file /home/ubuntu/app.env --name app {ecr_repo}:latest'
          ]

          command_id = send_command(instance_id, commands)

          while True:
              invocation = get_command_invocation(command_id, instance_id)
              if invocation['Status'] in ['Success', 'Failed']:
                  print(f"Command Status: {invocation['Status']}")
                  break
              time.sleep(5)
          PYEOF
          --args ${{ env.INSTANCE_ID }} ${{ env.AWS_REGION }} ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}