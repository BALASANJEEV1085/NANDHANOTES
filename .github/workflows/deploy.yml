                      print("SSM ping:", ping, "(" + str(i+1) + "/30)")
                      if ping == "Online":
                          break
                      time.sleep(10)

                  commands = [
                      "systemctl start docker 2>/dev/null || service docker start 2>/dev/null || true",
                      "until docker info > /dev/null 2>&1; do echo waiting; sleep 3; done",
                      "aws ecr get-login-password --region " + region + " | docker login --username AWS --password-stdin " + ecr_registry,
                      "docker pull " + image,
                      "docker stop app 2>/dev/null || true",
                      "docker rm app 2>/dev/null || true",
                      "aws secretsmanager get-secret-value --region " + region + " --secret-id " + secret_id + " --query SecretString --output text | python3 -c 'import sys,json; d=json.load(sys.stdin); [print(k+chr(61)+v) for k,v in d.items()]' > /home/ubuntu/app.env 2>/dev/null || touch /home/ubuntu/app.env",
                      "docker run -d --restart always -p 80:5000 --env-file /home/ubuntu/app.env --name app " + image,
                  ]
                  cli = json.dumps(dict(DocumentName="AWS-RunShellScript", InstanceIds=[instance_id], Parameters=dict(commands=commands)))
                  rc, cmd_id, err = aws("ssm", "send-command", "--region", region, "--cli-input-json", cli, "--query", "Command.CommandId", "--output", "text")
                  if rc != 0:
                      print("send-command failed:", err); sys.exit(1)
                  print("SSM CommandId:", cmd_id)

                  for i in range(36):
                      time.sleep(5)
                      _, status, _ = aws("ssm", "get-command-invocation", "--region", region, "--command-id", cmd_id, "--instance-id", instance_id, "--query", "Status", "--output", "text")
                      status = status or "Pending"
                      print("Status [" + str(i+1) + "/36]:", status)
                      if status == "Success":
                          print("Deployment succeeded!"); sys.exit(0)
                      if status in ("Failed", "Cancelled", "TimedOut"):
                          _, serr, _ = aws("ssm", "get-command-invocation", "--region", region, "--command-id", cmd_id, "--instance-id", instance_id, "--query", "StandardErrorContent", "--output", "text")
                          print("STDERR:", serr); sys.exit(1)
                  print("Timeout"); sys.exit(1)
